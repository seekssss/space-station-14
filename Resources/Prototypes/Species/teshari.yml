- type: species
  id: Teshari
  name: species-name-teshari
  roundStart: true
  prototype: MobTeshari
  sprites: MobTeshariSprites
  defaultSkinTone: "#5a3f2d"
  markingLimits: MobTeshariMarkingLimits
  dollPrototype: MobTeshariDummy
  skinColoration: TeshariColors
  maleFirstNames: names_teshari_male
  femaleFirstNames: names_teshari_female
  lastNames: names_teshari_last

- type: speciesBaseSprites
  id: MobTeshariSprites
  sprites:
    Head: MobTeshariHead
    UndergarmentTop: MobHumanoidAnyMarking
    UndergarmentBottom: MobHumanoidAnyMarking
    Chest: MobTeshariTorso
    HeadTop: MobHumanoidAnyMarking
    HeadSide: MobHumanoidAnyMarking
    Tail: MobHumanoidAnyMarking
    Eyes: MobTeshariEyes
    LArm: MobTeshariLArm
    RArm: MobTeshariRArm
    LHand: MobTeshariLHand
    RHand: MobTeshariRHand
    LLeg: MobTeshariLLeg
    RLeg: MobTeshariRLeg
    LFoot: MobTeshariLFoot
    RFoot: MobTeshariRFoot

- type: markingPoints # 6 points on arms and legs due to the "expected" marking usage. Two for hands, two for arms and 2 for claws. Can be lower once we have a distinction between LeftArm and RightArm instead of just Arms.
  id: MobTeshariMarkingLimits
  points:
    Hair:
      points: 1
      required: false
    FacialHair:
      points: 1
      onlyWhitelisted: true # Beards lack displacement maps and are impossible to displace onto a snout.
      required: false
    Tail:
      points: 1
      required: true
      defaultMarkings: [ TeshariTail ]
    Head:
      points: 3
      required: false
    HeadTop:
      points: 1
      required: true
      defaultMarkings: [ TeshariEar ]
    UndergarmentTop:
      points: 1
      required: false
    UndergarmentBottom:
      points: 1
      required: false
    Arms:
      points: 6
      required: false
    Legs:
      points: 6
      required: false

